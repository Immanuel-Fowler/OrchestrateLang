<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examples — OrchestrateLang</title>
<meta name="description" content="Every example program in the OrchestrateLang repository, loaded from the examples folder and highlighted.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
.ex { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 40px; align-items: start; padding-block: 28px 0; }
@media (max-width: 860px) { .ex { grid-template-columns: 1fr; gap: 20px; } }
.list { position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - var(--header-h) - 32px); overflow: auto; display: grid; gap: 18px; align-content: start; padding-right: 8px; }
@media (max-width: 860px) { .list { position: static; max-height: none; } }
.list h4 { font-family: var(--font-body); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.list a { display: grid; gap: 1px; padding: 6px 10px; margin-left: -10px; border-radius: 4px; color: var(--ink-2); text-decoration: none; font-size: 0.9rem; }
.list a code { background: none; padding: 0; color: inherit; font-size: 0.82rem; }
.list a small { color: var(--muted); font-size: 0.75rem; }
.list a:hover { background: var(--surface-2); color: var(--ink); }
.list a[aria-current="page"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 3px 0 0 var(--brass); }
.list a[aria-current="page"] code { font-weight: 600; }
.group { display: grid; gap: 2px; }
.head { display: grid; gap: 10px; margin-bottom: 20px; }
.head h1 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); }
.head .path { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.head p { color: var(--ink-2); max-width: 70ch; }
.needs { display: flex; flex-wrap: wrap; gap: 6px; }
.run { margin-top: 16px; display: grid; gap: 8px; }
.run .code pre { font-size: 0.82rem; }
.viewer .code pre { font-size: 0.85rem; }
.modlinks { margin-top: 18px; font-size: 0.9rem; color: var(--muted); }
.status { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink-2); font-size: 0.92rem; }
.status.error { border-color: var(--brass); background: var(--brass-wash); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pager a { text-decoration: none; font-weight: 600; color: var(--ink); }
.pager a.next { margin-left: auto; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="./" aria-label="OrchestrateLang home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M32 10 A22 22 0 0 1 43 51.05"/><path d="M35.82 53.67 A22 22 0 0 1 15.15 46.14"/><path d="M11.33 39.52 A22 22 0 0 1 24.48 11.33"/></g><circle cx="32" cy="32" r="6.5" fill="#d9911c"/></svg>
      <span class="name">OrchestrateLang</span> <span class="ver">v0.8.0</span>
    </a>
    <nav class="nav" aria-label="Site">
      <a href="./">Overview</a>
      <a href="docs.html">Docs</a>
      <a href="examples.html">Examples</a>
      <a class="hide-sm" href="docs.html#roadmap">Roadmap</a>
      <a class="hide-sm gh" href="https://github.com/Immanuel-Fowler/OrchestrateLang">GitHub</a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="main" class="wrap ex">
  <aside class="list" id="list" aria-label="Example programs"></aside>
  <section class="viewer">
    <div class="head" id="head"></div>
    <div id="code"><div class="status">Loading…</div></div>
    <div class="run" id="run"></div>
    <div class="modlinks" id="modlinks"></div>
    <div class="pager" id="pager"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div><p>Every file here is fetched from the repository's <code>examples/</code> folder at page load.</p></div>
    <div class="cols">
      <div><strong>Project</strong><a href="./">Overview</a><a href="docs.html">Docs</a><a href="https://github.com/Immanuel-Fowler/OrchestrateLang">GitHub</a></div>
    </div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  "use strict";
  const REPO = window.ORCH_REPO;
  const EXAMPLES = [
    { group: "Start here", items: [
      { id: "hello", title: "Hello", blurb: "The smallest program: one automatic block, then stop." },
      { id: "task_demo", title: "Tasks and triggers", blurb: "A worker fires a high-priority alert that a triggered block listens for." },
      { id: "multi_process", title: "Multiple processes", blurb: "Several process blocks running concurrently under one orchestrator." },
      { id: "lifecycle_hooks", title: "Lifecycle hooks", blurb: "on_start at boot, on_stop on Ctrl+C. Runs until interrupted." },
      { id: "supervised_process", title: "Supervised processes", blurb: "Restart policies of never, a count, and always, with on_crash handlers." }
    ]},
    { group: "Language", items: [
      { id: "pipeline", title: "Pipeline operator", blurb: "Pass a value through a readable left-to-right chain with |>." },
      { id: "async_parallel", title: "Parallel blocks", blurb: "Run two tasks concurrently and wait for both at one join point." },
      { id: "closures", title: "Closures", blurb: "Closures and higher-order array operations." },
      { id: "for_loops", title: "For loops", blurb: "Iterating arrays and ranges." },
      { id: "enums", title: "Enums and match", blurb: "Enum definitions, payload variants, and match expressions." },
      { id: "generics", title: "Generics", blurb: "Generic functions that keep their types." },
      { id: "error_handling", title: "Error handling", blurb: "result, option, try / catch, and ? propagation." },
      { id: "string_interpolation", title: "String interpolation", blurb: "Values embedded in strings with {name}." }
    ]},
    { group: "Serverlets", items: [
      { id: "serverlet", title: "In-process serverlet", blurb: "A counter service from a directory module, called through its typed client." },
      { id: "persistent_serverlet", title: "Persistent state", blurb: "Serverlet state survives across loop iterations." },
      { id: "resilient_serverlet", title: "Resilient serverlet", blurb: "A handler that panics is isolated by on_crash." },
      { id: "secret_serverlet", title: "Secret serverlet", blurb: "The service compiles to its own native executable." },
      { id: "python_landline", title: "Python landline", blurb: "A stateful Python 3.10+ service behind the same interface.", needs: ["Python 3.10+"] },
      { id: "typescript_landline", title: "TypeScript landline", blurb: "A TypeScript 7 service compiled to an executable.", needs: ["TypeScript 7", "Bun"] }
    ]},
    { group: "Foreign functions", items: [
      { id: "foreign_rust_math", title: "Rust functions", blurb: "pub fn's from a .rs file injected into the module.", module: "foreign_rust_math" },
      { id: "foreign_rust_strings", title: "Rust strings", blurb: "String transforms across the Rust boundary.", module: "foreign_rust_strings" },
      { id: "foreign_rust_mixed", title: "Rust plus OrchestrateLang", blurb: "A module mixing native helpers and foreign Rust.", module: "foreign_rust_mixed" },
      { id: "foreign_c_math", title: "C functions", blurb: "A C file with an .orch_ffi sidecar, compiled by cc-rs.", module: "foreign_c_math", needs: ["C compiler"] },
      { id: "foreign_cpp_stats", title: "C++ functions", blurb: "Statistics helpers over the C ABI.", module: "foreign_cpp_stats", needs: ["C++ compiler"] },
      { id: "foreign_zig_math", title: "Zig functions", blurb: "export fn's built with zig build-obj.", module: "foreign_zig_math", needs: ["Zig 0.16+"] },
      { id: "foreign_swift_math", title: "Swift functions", blurb: "@_cdecl functions compiled with swiftc.", module: "foreign_swift_math", needs: ["Swift 5.10+"] },
      { id: "foreign_typescript_math", title: "TypeScript functions", blurb: "A persistent compiled adapter for stateless TypeScript calls.", module: "foreign_typescript_math", needs: ["TypeScript 7", "Bun"] },
      { id: "foreign_mixed_all", title: "Everything at once", blurb: "C, Rust, and OrchestrateLang in one module.", module: "foreign_mixed_all", needs: ["C compiler"] }
    ]},
    { group: "Modules", items: [
      { id: "prom_demo", title: "PROM registry", blurb: "Import a module by its registered name instead of a path." }
    ]}
  ];
  const ALL = EXAMPLES.flatMap(function (g) { return g.items; });
  const byId = Object.fromEntries(ALL.map(function (e) { return [e.id, e]; }));
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  const list = document.getElementById("list");
  list.innerHTML = EXAMPLES.map(function (g) {
    return '<div class="group"><h4>' + g.group + '</h4>' + g.items.map(function (e) {
      return '<a href="#' + e.id + '" data-id="' + e.id + '"><code>' + e.id + '.orch</code><small>' + e.title + '</small></a>';
    }).join("") + "</div>";
  }).join("");

  let current = null;
  async function route() {
    const id = decodeURIComponent(location.hash.replace(/^#/, "")) || "hello";
    const ex = byId[id] || byId.hello;
    if (ex === current) return;
    current = ex;
    document.title = ex.id + ".orch — OrchestrateLang examples";
    list.querySelectorAll("a").forEach(function (a) {
      if (a.dataset.id === ex.id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    const path = "examples/" + ex.id + ".orch";
    document.getElementById("head").innerHTML =
      '<span class="path">' + path + "</span><h1>" + esc(ex.title) + "</h1><p>" + esc(ex.blurb) + "</p>" +
      (ex.needs ? '<div class="needs">' + ex.needs.map(function (n) { return '<span class="pill pill-planned">Needs ' + esc(n) + "</span>"; }).join("") + "</div>" : "");
    document.getElementById("run").innerHTML =
      '<div class="code"><div class="code-head"><span class="dot"></span>run it<button class="copy" type="button" data-copy>Copy</button></div><pre><code class="language-bash">orchestrate run ' + path + "</code></pre></div>";
    document.getElementById("modlinks").innerHTML = ex.module
      ? 'Uses the module in <a href="' + REPO + "/tree/main/examples/modules/" + ex.module + '" rel="noopener">examples/modules/' + ex.module + "</a> (module.orch, the foreign source, and its .orch_ffi sidecar)."
      : (ex.id === "serverlet" || ex.id === "prom_demo" ? 'Uses the module in <a href="' + REPO + '/tree/main/examples/modules/counter" rel="noopener">examples/modules/counter</a>.' : "");
    const idx = ALL.indexOf(ex);
    const prev = ALL[idx - 1], next = ALL[idx + 1];
    document.getElementById("pager").innerHTML =
      (prev ? '<a href="#' + prev.id + '">← ' + esc(prev.title) + "</a>" : "<span></span>") +
      (next ? '<a class="next" href="#' + next.id + '">' + esc(next.title) + " →</a>" : "");
    const box = document.getElementById("code");
    box.innerHTML = '<div class="status">Loading ' + path + "…</div>";
    try {
      const text = await window.orchFetchText(path);
      if (current !== ex) return;
      box.innerHTML = '<div class="code"><div class="code-head"><span class="dot"></span>' + ex.id + '.orch<a class="copy" style="margin-left:auto;text-decoration:none" href="' + REPO + "/blob/main/" + path + '" rel="noopener">GitHub ↗</a><button class="copy" type="button" data-copy style="margin-left:8px">Copy</button></div><pre><code class="language-orchestrate">' + esc(text) + "</code></pre></div>";
    } catch (e) {
      box.innerHTML = '<div class="status error"><strong>Could not load <code>' + path + "</code>.</strong><br>" + esc(e.message) +
        '<br><br>This page fetches the file from the repository at runtime. Serve the repository root with a static file server, or read it on <a href="' + REPO + "/blob/main/" + path + '">GitHub</a>.</div>';
    }
    window.orchHighlightAll(document.getElementById("main"));
    window.scrollTo({ top: 0 });
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
