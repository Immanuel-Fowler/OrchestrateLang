<style>
.docs { display: grid; grid-template-columns: 250px minmax(0, 1fr) 220px; gap: 40px; align-items: start; padding-block: 28px 0; }
@media (max-width: 1100px) { .docs { grid-template-columns: 240px minmax(0, 1fr); } .toc { display: none; } }
@media (max-width: 800px) { .docs { grid-template-columns: 1fr; gap: 20px; } }

/* sidebar */
.side { position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - var(--header-h) - 32px); overflow: auto; padding-right: 8px; display: grid; gap: 18px; align-content: start; }
@media (max-width: 800px) { .side { position: static; max-height: none; overflow: visible; } }
.search { position: relative; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); color: var(--ink); font: inherit; font-size: 0.92rem; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
.results { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow); max-height: 360px; overflow: auto; display: none; }
.results.open { display: block; }
.results a { display: grid; gap: 2px; padding: 8px 12px; text-decoration: none; border-bottom: 1px solid var(--line); color: var(--ink); font-size: 0.88rem; }
.results a:last-child { border-bottom: 0; }
.results a:hover, .results a:focus { background: var(--surface-2); }
.results small { color: var(--muted); font-size: 0.75rem; }
.results .none { padding: 10px 12px; color: var(--muted); font-size: 0.85rem; }
.group { display: grid; gap: 2px; }
.group h4 { font-family: var(--font-body); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.group a { display: block; padding: 5px 10px; margin-left: -10px; border-radius: 4px; color: var(--ink-2); text-decoration: none; font-size: 0.92rem; }
.group a:hover { background: var(--surface-2); color: var(--ink); }
.group a[aria-current="page"] { background: var(--surface-2); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--brass); }
.group a small { display: block; font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); font-weight: 400; }
@media (max-width: 800px) {
  .side-toggle { display: flex; }
  .side .groups { display: none; }
  .side.open .groups { display: grid; gap: 18px; }
}
.side-toggle { display: none; appearance: none; background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink); padding: 8px 12px; border-radius: 4px; font: inherit; align-items: center; gap: 8px; cursor: pointer; }

/* article */
.article { min-width: 0; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.82rem; color: var(--muted); margin-bottom: 18px; font-family: var(--font-mono); }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--ink); }
.crumbs .edit { margin-left: auto; font-family: var(--font-body); }
.md { max-width: 78ch; }
.md > :first-child { margin-top: 0; }
.md h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); margin: 0 0 20px; }
.md h2 { font-size: 1.55rem; margin: 48px 0 14px; padding-top: 18px; border-top: 1px solid var(--line); }
.md h3 { font-size: 1.15rem; margin: 30px 0 10px; }
.md h4 { font-size: 1rem; margin: 22px 0 8px; font-family: var(--font-body); font-weight: 600; }
.md h2 a.anchor, .md h3 a.anchor, .md h4 a.anchor { color: var(--line-strong); text-decoration: none; margin-left: 8px; font-weight: 400; opacity: 0; font-family: var(--font-mono); }
.md h2:hover a.anchor, .md h3:hover a.anchor, .md h4:hover a.anchor { opacity: 1; }
.md p { margin: 0 0 14px; }
.md ul, .md ol { padding-left: 1.4em; margin: 0 0 14px; }
.md li { margin: 4px 0; }
.md li > p { margin: 0 0 6px; }
.md blockquote { margin: 0 0 16px; padding: 10px 16px; border-left: 3px solid var(--brass); background: var(--brass-wash); border-radius: 0 4px 4px 0; color: var(--ink-2); }
.md blockquote p:last-child { margin: 0; }
.md .code { margin: 0 0 18px; }
.md .code pre { font-size: 0.83rem; }
.md .table-wrap { margin: 0 0 18px; }
.md table { font-size: 0.88rem; }
.md pre.plain { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font-size: 0.82rem; margin: 0 0 18px; color: var(--ink); }
.md .mermaid-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 0 0 18px; overflow-x: auto; }
.md .mermaid-box svg { max-width: 100%; height: auto; }
.md hr { margin: 32px 0; }
.md img { border-radius: 4px; }
.md kbd { border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 0.8em; }
.md del { color: var(--muted); }
.status { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink-2); font-size: 0.92rem; }
.status.error { border-color: var(--brass); background: var(--brass-wash); }
.status code { font-size: 0.8rem; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pager a { display: grid; gap: 2px; text-decoration: none; color: var(--ink); font-weight: 600; max-width: 48%; }
.pager a small { color: var(--muted); font-weight: 400; font-size: 0.78rem; }
.pager a.next { text-align: right; margin-left: auto; }

/* on this page */
.toc { position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - var(--header-h) - 32px); overflow: auto; font-size: 0.82rem; }
.toc h4 { font-family: var(--font-body); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.toc a { display: block; color: var(--muted); text-decoration: none; padding: 3px 0 3px 10px; border-left: 2px solid var(--line); line-height: 1.35; }
.toc a.l3 { padding-left: 22px; }
.toc a:hover { color: var(--ink); }
.toc a.active { color: var(--ink); border-left-color: var(--brass); }
</style>

<script>
(function () {
  "use strict";
  /* ---------- the manifest: which repository files the docs page shows ----------
     Paths are repository-relative. The GitHub Pages workflow copies each of them next
     to the site; when the repo root is served locally they are fetched from it. */
  const MANIFEST = [
    { group: "Start here", items: [
      { id: "overview", path: "README.md", title: "Overview", blurb: "The README: what the language is for, install, and a feature tour" },
      { id: "changelog", path: "CHANGELOG.md", title: "Changelog", blurb: "Release history and known limitations" },
      { id: "contributing", path: "CONTRIBUTING.md", title: "Contributing", blurb: "Development and release conventions" }
    ]},
    { group: "Language", items: [
      { id: "language-reference", path: "docs/language-reference.md", title: "Language reference", blurb: "Syntax, types, process blocks, the orchestrator, CLI, modules, internals" },
      { id: "library-mode", path: "docs/library-mode.md", title: "Library mode", blurb: "Embedding under a Rust host: lifecycle, ticks, events, grants, packaging" },
      { id: "design-philosophy", path: "docs/design-philosophy.md", title: "Design philosophy", blurb: "The principles new features are checked against" },
      { id: "roadmap", path: "docs/roadmap.md", title: "Roadmap", blurb: "Planned features, separated from shipped behavior" }
    ]},
    { group: "Design documents", items: [
      { id: "landline-serverlets", path: "docs/design/landline-serverlets.md", title: "Landline serverlets", blurb: "Python and TypeScript services over a checked protocol" },
      { id: "secret-serverlets", path: "docs/design/secret-serverlets.md", title: "Secret serverlets", blurb: "Out-of-process native services" },
      { id: "sandboxed-serverlets", path: "docs/design/sandboxed-serverlets.md", title: "Sandboxed serverlets", blurb: "WASM containment: the plan, not yet shipped" },
      { id: "serverlet-files", path: "docs/design/serverlet-files.md", title: "Serverlet files", blurb: "Independently packaged, live-editable services" }
    ]},
    { group: "Plans", items: [
      { id: "improvement-plan", path: "docs/plans/improvement-plan.md", title: "Improvement plan", blurb: "Error handling, types, debugging, supervision" },
      { id: "language-gaps", path: "docs/plans/language-gaps.md", title: "Language gaps", blurb: "The remaining gaps from the 2026-09 review" },
      { id: "next-level-plan", path: "docs/plans/next-level-plan.md", title: "Next-level plan", blurb: "Longer-horizon work" },
      { id: "typescript-native-backend", path: "docs/plans/typescript-native-backend.md", title: "TypeScript native backend", blurb: "In-process TypeScript through scriptc" },
      { id: "csharp-native-backend", path: "docs/plans/csharp-native-backend.md", title: "C# native backend", blurb: "C# in-process through .NET Native AOT" }
    ]},
    { group: "SDKs and tools", items: [
      { id: "python-sdk", path: "sdk/python/README.md", title: "Python SDK", blurb: "Implementing a Python landline" },
      { id: "typescript-sdk", path: "sdk/typescript/README.md", title: "TypeScript SDK", blurb: "TypeScript 7 landlines and FFI" },
      { id: "benchmarks", path: "benchmarks/README.md", title: "Benchmarks", blurb: "Measuring serverlet latency" },
      { id: "vscode", path: "editors/vscode/README.md", title: "VS Code extension", blurb: "Highlighting, snippets, and the language server" }
    ]}
  ];
  const ALL = MANIFEST.flatMap(function (g) { return g.items; });
  const byId = Object.fromEntries(ALL.map(function (d) { return [d.id, d]; }));
  const byPath = Object.fromEntries(ALL.map(function (d) { return [d.path, d]; }));
  const REPO = window.ORCH_REPO;
  const REF = window.ORCH_REF;
  const ROOT = window.ORCH_ROOT;

  /* ---------- sidebar ---------- */
  const groups = document.getElementById("groups");
  groups.innerHTML = MANIFEST.map(function (g) {
    return '<div class="group"><h4>' + g.group + '</h4>' + g.items.map(function (d) {
      return '<a href="#' + d.id + '" data-id="' + d.id + '">' + d.title + '<small>' + d.path + '</small></a>';
    }).join("") + '</div>';
  }).join("");
  const toggle = document.getElementById("side-toggle");
  toggle.addEventListener("click", function () {
    const open = document.getElementById("side").classList.toggle("open");
    toggle.setAttribute("aria-expanded", String(open));
  });

  /* ---------- markdown rendering ---------- */
  function slugger() {
    const seen = {};
    return function (text) {
      let s = window.orchSlug(text) || "section";
      if (seen[s] != null) { seen[s] += 1; s = s + "-" + seen[s]; } else { seen[s] = 0; }
      return s;
    };
  }
  function resolvePath(base, href) {
    const parts = base.split("/").slice(0, -1);
    href.split("/").forEach(function (seg) {
      if (seg === "..") parts.pop();
      else if (seg !== "." && seg !== "") parts.push(seg);
    });
    return parts.join("/");
  }
  function rewriteLink(doc, href) {
    if (!href) return href;
    if (/^(https?:|mailto:)/.test(href)) return href;
    if (href.startsWith("#")) return "#" + doc.id + "/" + href.slice(1);
    const m = href.match(/^([^#]*)(#.*)?$/);
    const target = resolvePath(doc.path, m[1]);
    const frag = m[2] ? "/" + m[2].slice(1) : "";
    const known = byPath[target];
    if (known) return "#" + known.id + frag;
    if (/^examples\/[^/]+\.orch$/.test(target)) return "examples.html#" + target.replace(/^examples\//, "").replace(/\.orch$/, "");
    return REPO + "/blob/" + REF + "/" + target;
  }
  function escapeHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  function render(doc, markdown) {
    const slug = slugger();
    const headings = [];
    const renderer = new marked.Renderer();
    renderer.heading = function (text, level) {
      const id = slug(text.replace(/<[^>]+>/g, ""));
      if (level === 2 || level === 3) headings.push({ id: id, level: level, text: text.replace(/<[^>]+>/g, "") });
      const anchor = level > 1 ? '<a class="anchor" href="#' + doc.id + '/' + id + '" aria-label="Link to this section">#</a>' : "";
      return "<h" + level + ' id="' + id + '">' + text + anchor + "</h" + level + ">";
    };
    renderer.link = function (href, title, text) {
      const h = rewriteLink(doc, href);
      const ext = /^https?:/.test(h) ? ' rel="noopener"' : "";
      return '<a href="' + h + '"' + (title ? ' title="' + escapeHtml(title) + '"' : "") + ext + ">" + text + "</a>";
    };
    renderer.image = function (href, title, text) {
      const src = /^https?:/.test(href) ? href : window.orchSourceUrl(resolvePath(doc.path, href));
      return '<img src="' + src + '" alt="' + escapeHtml(text || "") + '"' + (title ? ' title="' + escapeHtml(title) + '"' : "") + ">";
    };
    renderer.code = function (code, lang) {
      const language = (lang || "").trim().toLowerCase();
      if (language === "mermaid") {
        return '<div class="mermaid-box"><pre class="mermaid">' + escapeHtml(code) + "</pre></div>";
      }
      if (language === "text" || language === "" ) {
        return '<pre class="plain"><code>' + escapeHtml(code) + "</code></pre>";
      }
      const alias = { orchestrate: "orchestrate", orch: "orchestrate", orchestratelang: "orchestrate", sh: "bash", shell: "bash", zsh: "bash", console: "bash", powershell: "powershell", ps1: "powershell", toml: "ini", ts: "typescript", py: "python", rs: "rust", js: "javascript" }[language] || language;
      const known = window.hljs && window.hljs.getLanguage(alias) ? alias : "plaintext";
      return '<div class="code"><div class="code-head"><span class="dot"></span>' + escapeHtml(language) +
        '<button class="copy" type="button" data-copy>Copy</button></div><pre><code class="language-' + known + '">' + escapeHtml(code) + "</code></pre></div>";
    };
    renderer.table = function (header, body) {
      return '<div class="table-wrap"><table><thead>' + header + "</thead><tbody>" + body + "</tbody></table></div>";
    };
    marked.setOptions({ gfm: true, breaks: false });
    const html = marked.parse(markdown, { renderer: renderer });
    return { html: html, headings: headings };
  }

  /* ---------- mermaid ---------- */
  function isDark() {
    const t = document.documentElement.getAttribute("data-theme");
    return t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
  }
  async function drawMermaid(scope) {
    if (!window.mermaid) return;
    const nodes = scope.querySelectorAll("pre.mermaid");
    if (!nodes.length) return;
    nodes.forEach(function (n) { if (!n.dataset.src) n.dataset.src = n.textContent; n.textContent = n.dataset.src; n.removeAttribute("data-processed"); });
    window.mermaid.initialize({
      startOnLoad: false, securityLevel: "strict", theme: "base", fontFamily: "Instrument Sans, sans-serif",
      themeVariables: isDark()
        ? { background: "#172231", primaryColor: "#1f2c3d", primaryTextColor: "#e9eef4", primaryBorderColor: "#7b93e8", lineColor: "#96a5b6", secondaryColor: "#2a3646", tertiaryColor: "#1f2c3d", fontSize: "14px" }
        : { background: "#ffffff", primaryColor: "#e9edf3", primaryTextColor: "#14213d", primaryBorderColor: "#3a5bc7", lineColor: "#5b6b7b", secondaryColor: "#f3f5f8", tertiaryColor: "#ffffff", fontSize: "14px" }
    });
    try { await window.mermaid.run({ nodes: nodes }); } catch (e) { /* leave the source visible */ }
  }
  document.querySelectorAll("[data-theme-toggle]").forEach(function (b) {
    b.addEventListener("click", function () { setTimeout(function () { drawMermaid(document.getElementById("md")); }, 0); });
  });

  /* ---------- routing ---------- */
  const cache = {};
  async function load(doc) {
    if (cache[doc.path]) return cache[doc.path];
    const text = await window.orchFetchText(doc.path);
    cache[doc.path] = text;
    return text;
  }
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { doc: byId["language-reference"], frag: "" };
    const i = raw.indexOf("/");
    const id = i >= 0 ? raw.slice(0, i) : raw;
    const frag = i >= 0 ? raw.slice(i + 1) : "";
    return { doc: byId[id] || byId["language-reference"], frag: frag };
  }
  let current = null;
  async function route() {
    const r = parseHash();
    const md = document.getElementById("md");
    const tocEl = document.getElementById("toc");
    if (current !== r.doc) {
      current = r.doc;
      document.title = r.doc.title + " — OrchestrateLang docs";
      document.querySelectorAll(".group a").forEach(function (a) {
        if (a.dataset.id === r.doc.id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
      });
      document.getElementById("crumbs").innerHTML =
        '<a href="./">OrchestrateLang</a><span>/</span><a href="' + REPO + '/tree/' + REF + '" rel="noopener">' + REF + '</a>' +
        '<span>/</span><span>' + r.doc.path + '</span>' +
        '<a class="edit" href="' + REPO + '/blob/' + REF + '/' + r.doc.path + '" rel="noopener">Edit on GitHub ↗</a>';
      md.innerHTML = '<div class="status">Loading ' + r.doc.path + '…</div>';
      tocEl.innerHTML = "";
      try {
        const text = await load(r.doc);
        if (current !== r.doc) return;
        const out = render(r.doc, text);
        md.innerHTML = out.html;
        window.orchHighlightAll(md);
        drawMermaid(md);
        tocEl.innerHTML = out.headings.length ? "<h4>On this page</h4>" + out.headings.map(function (h) {
          return '<a class="l' + h.level + '" href="#' + r.doc.id + '/' + h.id + '">' + escapeHtml(h.text) + "</a>";
        }).join("") : "";
        const idx = ALL.indexOf(r.doc);
        const prev = ALL[idx - 1], next = ALL[idx + 1];
        document.getElementById("pager").innerHTML =
          (prev ? '<a class="prev" href="#' + prev.id + '"><small>Previous</small>← ' + prev.title + "</a>" : "<span></span>") +
          (next ? '<a class="next" href="#' + next.id + '"><small>Next</small>' + next.title + " →</a>" : "");
        observeHeadings();
      } catch (e) {
        md.innerHTML = '<div class="status error"><strong>Could not load <code>' + r.doc.path + '</code>.</strong><br>' +
          escapeHtml(e.message) + '<br><br>This page fetches Markdown from the repository at runtime. Serve the repository root with a static file server (for example <code>python3 -m http.server</code> in the repo and open <code>/website/</code>), or read it on <a href="' + REPO + '/blob/main/' + r.doc.path + '">GitHub</a>.</div>';
        return;
      }
    }
    if (r.frag) {
      const target = document.getElementById(r.frag);
      if (target) target.scrollIntoView({ block: "start" });
    } else if (current === r.doc) {
      window.scrollTo({ top: 0 });
    }
  }
  window.addEventListener("hashchange", route);
  route();

  /* ---------- active heading in the TOC ---------- */
  let observer = null;
  function observeHeadings() {
    if (observer) observer.disconnect();
    const links = Array.from(document.querySelectorAll("#toc a"));
    if (!links.length || !("IntersectionObserver" in window)) return;
    const map = new Map(links.map(function (a) { return [a.getAttribute("href").split("/").pop(), a]; }));
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          links.forEach(function (a) { a.classList.remove("active"); });
          const a = map.get(en.target.id);
          if (a) a.classList.add("active");
        }
      });
    }, { rootMargin: "-80px 0px -70% 0px", threshold: 0 });
    document.querySelectorAll("#md h2, #md h3").forEach(function (h) { observer.observe(h); });
  }

  /* ---------- heading search across every doc ---------- */
  const input = document.getElementById("search");
  const results = document.getElementById("results");
  let index = null;
  async function buildIndex() {
    if (index) return index;
    const entries = [];
    await Promise.all(ALL.map(async function (doc) {
      let text;
      try { text = await load(doc); } catch (e) { return; }
      const slug = slugger();
      let inFence = false;
      text.split("\n").forEach(function (line) {
        if (/^\s*```/.test(line)) { inFence = !inFence; return; }
        if (inFence) return;
        const m = line.match(/^(#{1,4})\s+(.+?)\s*#*\s*$/);
        if (!m) return;
        const clean = m[2].replace(/[`*_]/g, "");
        entries.push({ doc: doc, level: m[1].length, text: clean, id: slug(clean) });
      });
    }));
    index = entries;
    return entries;
  }
  function showResults(q) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) { results.classList.remove("open"); return; }
    const hits = index.filter(function (e) {
      const hay = (e.doc.title + " " + e.text).toLowerCase();
      return terms.every(function (t) { return hay.includes(t); });
    }).slice(0, 30);
    results.innerHTML = hits.length ? hits.map(function (e) {
      const href = e.level === 1 ? "#" + e.doc.id : "#" + e.doc.id + "/" + e.id;
      return '<a href="' + href + '" role="option">' + escapeHtml(e.text) + "<small>" + escapeHtml(e.doc.title) + "</small></a>";
    }).join("") : '<div class="none">No headings match.</div>';
    results.classList.add("open");
  }
  input.addEventListener("focus", function () { buildIndex(); });
  input.addEventListener("input", async function () { await buildIndex(); showResults(input.value); });
  input.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { results.classList.remove("open"); input.blur(); }
    if (ev.key === "ArrowDown") { const f = results.querySelector("a"); if (f) { f.focus(); ev.preventDefault(); } }
  });
  results.addEventListener("keydown", function (ev) {
    const items = Array.from(results.querySelectorAll("a"));
    const i = items.indexOf(document.activeElement);
    if (ev.key === "ArrowDown" && items[i + 1]) { items[i + 1].focus(); ev.preventDefault(); }
    if (ev.key === "ArrowUp") { (items[i - 1] || input).focus(); ev.preventDefault(); }
    if (ev.key === "Escape") { results.classList.remove("open"); input.focus(); }
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest(".search")) results.classList.remove("open");
  });
  results.addEventListener("click", function () { results.classList.remove("open"); document.getElementById("side").classList.remove("open"); });
  groups.addEventListener("click", function (ev) { if (ev.target.closest("a")) { document.getElementById("side").classList.remove("open"); toggle.setAttribute("aria-expanded", "false"); } });
})();
</script>
</body>
</html>
