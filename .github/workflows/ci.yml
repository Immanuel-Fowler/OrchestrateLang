name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # wasm32-wasip1 builds sandboxed serverlets' guests; wasm32-unknown-unknown builds
      # the module the `load_foreign "wasm"` test loads.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # TypeScript landlines and FFI need `tsc` (TypeScript 7) on PATH; the native
      # scriptc backend is macOS-first, so Linux exercises the Bun backend only.
      - name: Install TypeScript 7
        run: |
          bun add -g typescript@7
          bun pm bin -g >> "$GITHUB_PATH"

      - name: Install scriptc
        if: runner.os == 'macOS'
        run: bun add -g scriptc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked --no-fail-fast
