name: website

# Publishes website/ to GitHub Pages from the `website` branch. The site has no
# build step: the docs and examples pages fetch Markdown and .orch files at
# runtime, so the repository files they read are copied next to the site in
# the deployed artifact.
#
# To deploy: push to the `website` branch (or run this workflow by hand). The
# first run enables Pages for the repository; if that step is refused, enable
# it once under Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enables Pages when the token is allowed to; otherwise Pages must be switched
      # on once under Settings → Pages → Source: "GitHub Actions", and this step is
      # a no-op after that.
      - name: Enable Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -R website/. dist/
          rm -f dist/README.md
          # Files the docs and examples pages fetch at runtime, at the same
          # repository-relative paths they use.
          cp -R docs dist/docs
          mkdir -p dist/examples
          cp examples/*.orch dist/examples/
          cp -R examples/modules dist/examples/modules
          cp -R examples/python dist/examples/python
          cp README.md CHANGELOG.md CONTRIBUTING.md LICENSE dist/
          mkdir -p dist/sdk/python dist/sdk/typescript dist/benchmarks dist/editors/vscode
          cp sdk/python/README.md dist/sdk/python/README.md
          cp sdk/typescript/README.md dist/sdk/typescript/README.md
          cp benchmarks/README.md dist/benchmarks/README.md
          cp editors/vscode/README.md dist/editors/vscode/README.md
          touch dist/.nojekyll
          find dist -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The job deliberately does not bind to the `github-pages` environment: that
  # environment's default protection rule only lets the default branch deploy,
  # and this site deploys from `website`. The URL is printed at the end.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Site URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
