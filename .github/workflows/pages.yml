name: website

# Publishes website/ to GitHub Pages from the `website` branch.
#
# The site reads documentation, examples and the version number from the default
# branch at page load, so a docs change on `main` is live without a redeploy.
# The copies placed beside the site here are only a fallback for when the raw
# host cannot be reached, and they are taken from `main` rather than from this
# branch so the fallback does not drift.
#
# There is no scheduled refresh: GitHub only fires `schedule` from the default
# branch, and this workflow lives here, so a cron here would never run. Run the
# workflow by hand to refresh the snapshot against a newer `main`.
#
# To deploy: push to the `website` branch (or run this workflow by hand). The
# first run enables Pages for the repository; if that step is refused, enable
# it once under Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      # The fallback copies come from the default branch, not from this one.
      - name: Check out the default branch for docs and examples
        uses: actions/checkout@v4
        with:
          ref: main
          path: .source

      # Enables Pages when the token is allowed to; otherwise Pages must be switched
      # on once under Settings → Pages → Source: "GitHub Actions", and this step is
      # a no-op after that.
      - name: Enable Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -R website/. dist/
          rm -f dist/README.md
          # Files the docs and examples pages fetch at runtime, at the same
          # repository-relative paths they use.
          # Fallback snapshot, taken from the default branch.
          src=.source
          cp -R "$src/docs" dist/docs
          mkdir -p dist/examples
          cp "$src"/examples/*.orch dist/examples/
          cp -R "$src/examples/modules" dist/examples/modules
          cp -R "$src/examples/python" dist/examples/python
          cp "$src"/README.md "$src"/CHANGELOG.md "$src"/CONTRIBUTING.md "$src"/LICENSE dist/
          mkdir -p dist/sdk/python dist/sdk/typescript dist/benchmarks dist/editors/vscode
          cp "$src/sdk/python/README.md" dist/sdk/python/README.md
          cp "$src/sdk/typescript/README.md" dist/sdk/typescript/README.md
          cp "$src/benchmarks/README.md" dist/benchmarks/README.md
          cp "$src/editors/vscode/README.md" dist/editors/vscode/README.md
          rm -rf dist/.source
          touch dist/.nojekyll
          find dist -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The job deliberately does not bind to the `github-pages` environment: that
  # environment's default protection rule only lets the default branch deploy,
  # and this site deploys from `website`. The URL is printed at the end.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Site URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
