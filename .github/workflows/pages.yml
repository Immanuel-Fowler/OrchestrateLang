name: website

# Publishes website/ to GitHub Pages. The site has no build step: the docs and
# examples pages fetch Markdown and .orch files at runtime, so the repository
# files they read are copied next to the site in the deployed artifact.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "examples/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "sdk/*/README.md"
      - "benchmarks/README.md"
      - "editors/vscode/README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -R website/. dist/
          rm -f dist/README.md
          # Files the docs and examples pages fetch at runtime, at the same
          # repository-relative paths they use.
          cp -R docs dist/docs
          mkdir -p dist/examples
          cp examples/*.orch dist/examples/
          cp README.md CHANGELOG.md CONTRIBUTING.md LICENSE dist/
          mkdir -p dist/sdk/python dist/sdk/typescript dist/benchmarks dist/editors/vscode
          cp sdk/python/README.md dist/sdk/python/README.md
          cp sdk/typescript/README.md dist/sdk/typescript/README.md
          cp benchmarks/README.md dist/benchmarks/README.md
          cp editors/vscode/README.md dist/editors/vscode/README.md
          touch dist/.nojekyll
          find dist -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
